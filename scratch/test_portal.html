<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Animation Test</title>
    <style>
        :root {
            --bg-void: #030014;
            --tech-cyan: #00f2fe;
            --cult-pink: #ff007f;
            --cult-purple: #9d4edd;
            --code-orange: #ff5722;
            --code-amber: #ff9100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-void);
        }

        .portal-warp-section {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0c0827 0%, #050215 50%, #02000a 100%);
            perspective: 1200px;
            overflow: hidden;
            z-index: 99999;
        }

        .portal-warp-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .portal-glitch-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            mix-blend-mode: hard-light;
            transition: opacity 0.05s ease;
        }

        .portal-glitch-overlay.active {
            opacity: 0.65;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 242, 254, 0.12) 0px,
                rgba(0, 242, 254, 0.12) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        .portal-flash-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #ffffff 0%, #00f2fe 30%, #ff007f 65%, transparent 100%);
            opacity: 0;
            z-index: 40;
            pointer-events: none;
            mix-blend-mode: screen;
            transition: opacity 0.08s ease-out;
        }

        .portal-flash-overlay.active-flash {
            opacity: 1;
        }

        .portal-shockwave-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.05);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 4px solid var(--tech-cyan);
            box-shadow: 0 0 60px var(--cult-pink), inset 0 0 60px var(--tech-cyan);
            opacity: 0;
            pointer-events: none;
            z-index: 35;
        }

        .portal-shockwave-ring.blast {
            animation: shockwaveExplode 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        .portal-shockwave-ring-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.05);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 3px solid var(--cult-pink);
            box-shadow: 0 0 40px var(--code-orange);
            opacity: 0;
            pointer-events: none;
            z-index: 34;
        }

        .portal-shockwave-ring-2.blast {
            animation: shockwaveExplode 1.4s cubic-bezier(0.15, 0.85, 0.25, 1) 0.1s forwards;
        }

        @keyframes shockwaveExplode {
            0% {
                transform: translate(-50%, -50%) scale(0.05);
                opacity: 1;
                border-width: 10px;
            }
            70% {
                opacity: 0.85;
                border-width: 3px;
            }
            100% {
                transform: translate(-50%, -50%) scale(6);
                opacity: 0;
                border-width: 1px;
            }
        }

        #portal-stage {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
        }

        .portal-septagon-wrap {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        @media (min-width: 768px) {
            .portal-septagon-wrap {
                width: 440px;
                height: 440px;
            }
        }

        .portal-orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .portal-orbit-ring-1 {
            width: 124%;
            height: 124%;
            border-color: rgba(0, 242, 254, 0.3);
            animation: spinClockwise 18s linear infinite;
        }

        .portal-orbit-ring-2 {
            width: 148%;
            height: 148%;
            border-color: rgba(255, 0, 127, 0.25);
            animation: spinCounterClockwise 25s linear infinite;
        }

        .portal-orbit-ring-3 {
            width: 172%;
            height: 172%;
            border-color: rgba(255, 87, 34, 0.25);
            animation: spinClockwise 32s linear infinite;
        }

        .portal-orbit-comet {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .portal-comet-cyan {
            background: var(--tech-cyan);
            box-shadow: 0 0 18px var(--tech-cyan), 0 0 35px var(--tech-cyan);
        }

        .portal-comet-pink {
            background: var(--cult-pink);
            box-shadow: 0 0 18px var(--cult-pink), 0 0 35px var(--cult-pink);
        }

        .portal-comet-orange {
            background: var(--code-orange);
            box-shadow: 0 0 18px var(--code-orange), 0 0 35px var(--code-amber);
        }

        @keyframes spinClockwise {
            from { transform: rotateZ(0deg); }
            to { transform: rotateZ(360deg); }
        }

        @keyframes spinCounterClockwise {
            from { transform: rotateZ(360deg); }
            to { transform: rotateZ(0deg); }
        }

        .portal-septagon-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: visible;
            transform-origin: center center;
            filter: drop-shadow(0 0 30px rgba(0, 242, 254, 0.55));
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            opacity: 0;
            transform: scale(0.15) rotate(180deg);
        }

        .portal-septagon-glow {
            fill: none;
            stroke: url(#portal-septagon-grad);
            stroke-width: 6;
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            filter: blur(4px);
            opacity: 0.95;
        }

        .portal-septagon-core {
            fill: rgba(7, 5, 25, 0.65);
            stroke: url(#portal-septagon-grad);
            stroke-width: 3;
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
        }

        .portal-center-aura {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 87, 34, 0.28) 0%, rgba(255, 0, 127, 0.2) 40%, rgba(0, 242, 254, 0.15) 70%, transparent 100%);
            filter: blur(20px);
            opacity: 0;
            transform: scale(0.3);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 10;
        }

        .portal-center-aura.active {
            opacity: 1;
            transform: scale(1.3);
            animation: auraBreathing 3.5s infinite ease-in-out alternate;
        }

        @keyframes auraBreathing {
            0% { transform: scale(1.15); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 1; }
        }

        .portal-logo-emblem {
            position: relative;
            width: 65%;
            height: 65%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 18;
            transform-style: preserve-3d;
        }

        .portal-code-logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            opacity: 0;
            transform: scale(0.35) translateZ(80px);
            transition: all 1.1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 25px rgba(255, 87, 34, 0.85)) drop-shadow(0 0 45px rgba(0, 242, 254, 0.65));
        }

        .portal-code-logo-svg.revealed {
            opacity: 1;
            transform: scale(1) translateZ(50px);
            animation: logoFloat 4s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: scale(1) translateZ(50px) translateY(0px); }
            100% { transform: scale(1.04) translateZ(60px) translateY(-8px); }
        }

        .portal-bracket-stroke, .portal-slash-stroke {
            stroke-dasharray: 250;
            stroke-dashoffset: 250;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portal-bracket-stroke.drawn, .portal-slash-stroke.drawn {
            stroke-dashoffset: 0;
        }

        .portal-bracket-core, .portal-slash-core {
            stroke-dasharray: 250;
            stroke-dashoffset: 250;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portal-bracket-core.drawn, .portal-slash-core.drawn {
            stroke-dashoffset: 0;
        }

        .portal-controls-row {
            position: fixed;
            top: 24px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
        }

        .portal-skip-btn, .portal-audio-btn {
            background: rgba(14, 8, 28, 0.75);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #fff;
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 18px;
            font-family: 'Orbitron', -apple-system, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.2);
            transition: all 0.3s ease;
        }

        .portal-skip-btn:hover, .portal-audio-btn:hover {
            border-color: var(--tech-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: scale(1.05);
        }

        .portal-loader-indicator {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10000;
        }

        .portal-loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #00f2fe, #9d4edd);
            box-shadow: 0 0 10px #00f2fe;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <section id="loader-screen" class="portal-warp-section">
        <canvas id="portal-warp-canvas" class="portal-warp-canvas"></canvas>
        <div id="portal-glitch-overlay" class="portal-glitch-overlay"></div>
        <div id="portal-flash-overlay" class="portal-flash-overlay"></div>
        <div id="portal-shockwave-ring" class="portal-shockwave-ring"></div>
        <div id="portal-shockwave-ring-2" class="portal-shockwave-ring-2"></div>

        <div id="portal-stage">
            <div class="portal-septagon-wrap" id="portal-septagon-wrap">
                <div class="portal-center-aura" id="portal-aura-glow"></div>
                
                <div class="portal-orbit-ring portal-orbit-ring-1">
                    <div class="portal-orbit-comet portal-comet-cyan"></div>
                </div>
                <div class="portal-orbit-ring portal-orbit-ring-2">
                    <div class="portal-orbit-comet portal-comet-pink"></div>
                </div>
                <div class="portal-orbit-ring portal-orbit-ring-3">
                    <div class="portal-orbit-comet portal-comet-orange"></div>
                </div>

                <!-- 7-Sided Septagon Frame -->
                <svg viewBox="0 0 100 100" class="portal-septagon-svg" id="portal-septagon-svg">
                    <defs>
                        <linearGradient id="portal-septagon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff007f" />
                            <stop offset="35%" stop-color="#ff5722" />
                            <stop offset="70%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#9d4edd" />
                        </linearGradient>
                    </defs>
                    <polygon points="50,2.5 87.1,20.4 96.3,60.6 70.6,92.8 29.4,92.8 3.7,60.6 12.9,20.4" class="portal-septagon-glow" id="portal-poly-glow" />
                    <polygon points="50,2.5 87.1,20.4 96.3,60.6 70.6,92.8 29.4,92.8 3.7,60.6 12.9,20.4" class="portal-septagon-core" id="portal-poly-core" />
                </svg>

                <!-- Glowing Laser Code Logo </> -->
                <div class="portal-logo-emblem">
                    <svg viewBox="0 0 200 200" class="portal-code-logo-svg" id="portal-code-logo-svg">
                        <defs>
                            <linearGradient id="portal-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff007f" />
                                <stop offset="30%" stop-color="#ff5722" />
                                <stop offset="65%" stop-color="#ff9100" />
                                <stop offset="100%" stop-color="#00f2fe" />
                            </linearGradient>
                        </defs>
                        <g>
                            <path class="portal-bracket-stroke" id="portal-bracket-left"
                                  d="M 68 62 L 28 100 L 68 138"
                                  fill="none" stroke="url(#portal-logo-grad)"
                                  stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
                            <path class="portal-bracket-core" id="portal-bracket-left-core"
                                  d="M 68 62 L 28 100 L 68 138"
                                  fill="none" stroke="#ffffff"
                                  stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

                            <line class="portal-slash-stroke" id="portal-slash-center"
                                  x1="116" y1="52" x2="84" y2="148"
                                  stroke="url(#portal-logo-grad)"
                                  stroke-width="15" stroke-linecap="round" />
                            <line class="portal-slash-core" id="portal-slash-center-core"
                                  x1="116" y1="52" x2="84" y2="148"
                                  stroke="#ffffff"
                                  stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

                            <path class="portal-bracket-stroke" id="portal-bracket-right"
                                  d="M 132 62 L 172 100 L 132 138"
                                  fill="none" stroke="url(#portal-logo-grad)"
                                  stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
                            <path class="portal-bracket-core" id="portal-bracket-right-core"
                                  d="M 132 62 L 172 100 L 132 138"
                                  fill="none" stroke="#ffffff"
                                  stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
                        </g>
                    </svg>
                </div>
            </div>
        </div>

        <div class="portal-controls-row">
            <button id="portal-audio-btn" class="portal-audio-btn" type="button" aria-label="Toggle Sound">
                <span>SOUND</span>
            </button>
            <button id="portal-skip-btn" class="portal-skip-btn" type="button" aria-label="Skip Intro Video">
                <span>SKIP INTRO</span>
            </button>
        </div>

        <div class="portal-loader-indicator">
            <div id="portal-loader-bar" class="portal-loader-bar"></div>
        </div>
    </section>

    <script>
        const canvas = document.getElementById('portal-warp-canvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('portal-stage');
        const flashOverlay = document.getElementById('portal-flash-overlay');
        const shockwave1 = document.getElementById('portal-shockwave-ring');
        const shockwave2 = document.getElementById('portal-shockwave-ring-2');
        const glitchOverlay = document.getElementById('portal-glitch-overlay');
        const septagonSvg = document.getElementById('portal-septagon-svg');
        const polyGlow = document.getElementById('portal-poly-glow');
        const polyCore = document.getElementById('portal-poly-core');
        const auraGlow = document.getElementById('portal-aura-glow');
        const codeLogoSvg = document.getElementById('portal-code-logo-svg');
        const loaderBar = document.getElementById('portal-loader-bar');

        const strokeLeft = document.getElementById('portal-bracket-left');
        const coreLeft = document.getElementById('portal-bracket-left-core');
        const strokeSlash = document.getElementById('portal-slash-center');
        const coreSlash = document.getElementById('portal-slash-center-core');
        const strokeRight = document.getElementById('portal-bracket-right');
        const coreRight = document.getElementById('portal-bracket-right-core');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let cx = width / 2;
        let cy = height / 2;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        });

        const STAR_COUNT = 380;
        const stars = [];
        const COLOR_PALETTE = ['#00f2fe', '#ff007f', '#ff5722', '#ffffff'];

        class Star {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2.2;
                this.y = (Math.random() - 0.5) * height * 2.2;
                this.z = initial ? Math.random() * 2000 : 2000;
                this.pz = this.z;
                const p = Math.random();
                if (p < 0.40) this.colorIdx = 0;
                else if (p < 0.70) this.colorIdx = 1;
                else if (p < 0.88) this.colorIdx = 2;
                else this.colorIdx = 3;
                this.baseSize = Math.random() * 1.8 + 0.8;
            }
            update(speed) {
                this.pz = this.z;
                this.z -= speed;
                if (this.z <= 1) this.reset(false);
            }
        }

        for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

        function drawAllStars(speed) {
            for (let i = 0; i < STAR_COUNT; i++) stars[i].update(speed);
            const isStreaking = speed > 10;
            ctx.lineCap = 'round';

            for (let c = 0; c < 4; c++) {
                ctx.beginPath();
                ctx.strokeStyle = COLOR_PALETTE[c];
                ctx.fillStyle = COLOR_PALETTE[c];
                let hasDrawn = false;

                for (let i = 0; i < STAR_COUNT; i++) {
                    const s = stars[i];
                    if (s.colorIdx !== c) continue;
                    const k = 420 / s.z;
                    const px = s.x * k + cx;
                    const py = s.y * k + cy;

                    if (px < -80 || px > width + 80 || py < -80 || py > height + 80) continue;

                    if (isStreaking) {
                        const pk = 420 / s.pz;
                        const ppx = s.x * pk + cx;
                        const ppy = s.y * pk + cy;
                        ctx.moveTo(ppx, ppy);
                        ctx.lineTo(px, py);
                        hasDrawn = true;
                    } else {
                        const size = Math.max(0.7, (1 - s.z / 2000) * s.baseSize);
                        ctx.moveTo(px + size, py);
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        hasDrawn = true;
                    }
                }

                if (hasDrawn) {
                    if (isStreaking) {
                        ctx.lineWidth = speed > 35 ? 2.2 : 1.5;
                        ctx.stroke();
                    } else {
                        ctx.fill();
                    }
                }
            }
        }

        const RING_COUNT = 14;
        const tunnelRings = [];
        for (let i = 0; i < RING_COUNT; i++) {
            tunnelRings.push({
                z: (i / RING_COUNT) * 1900,
                angle: (i * 0.22)
            });
        }

        function drawSeptagon(ctx, x, y, radius, rotation) {
            ctx.beginPath();
            const sides = 7;
            for (let i = 0; i < sides; i++) {
                const a = rotation + (i * Math.PI * 2 / sides);
                const sx = x + Math.cos(a) * radius;
                const sy = y + Math.sin(a) * radius;
                if (i === 0) ctx.moveTo(sx, sy);
                else ctx.lineTo(sx, sy);
            }
            ctx.closePath();
        }

        let animStartTime = performance.now();
        let warpSpeed = 95;
        let currentPhase = 'fast_warp';
        let globalRotation = 0;
        let frameCount = 0;

        function startAnimation() {
            animStartTime = performance.now();
            currentPhase = 'fast_warp';
            warpSpeed = 95;

            codeLogoSvg.classList.remove('revealed');
            auraGlow.classList.remove('active');
            flashOverlay.classList.remove('active-flash');
            shockwave1.classList.remove('blast');
            shockwave2.classList.remove('blast');

            polyGlow.style.strokeDashoffset = '600';
            polyCore.style.strokeDashoffset = '600';
            septagonSvg.style.transform = 'scale(0.15) rotate(180deg)';
            septagonSvg.style.opacity = '0';

            [strokeLeft, coreLeft, strokeSlash, coreSlash, strokeRight, coreRight].forEach(el => {
                el.classList.remove('drawn');
            });

            if (loaderBar) {
                loaderBar.style.transition = 'none';
                loaderBar.style.width = '0%';
                requestAnimationFrame(() => {
                    loaderBar.style.transition = 'width 4.8s linear';
                    loaderBar.style.width = '100%';
                });
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);
            frameCount++;

            const elapsed = (now - animStartTime) / 1000;

            ctx.fillStyle = warpSpeed > 30 ? 'rgba(3, 0, 20, 0.35)' : 'rgba(3, 0, 20, 0.65)';
            ctx.fillRect(0, 0, width, height);

            if (elapsed < 2.0) {
                currentPhase = 'fast_warp';
                warpSpeed = 90 + Math.sin(elapsed * 4) * 15;
                if (frameCount % 12 === 0) glitchOverlay.classList.add('active');
                else if (frameCount % 6 === 0) glitchOverlay.classList.remove('active');
            } else if (elapsed >= 2.0 && elapsed < 2.3) {
                currentPhase = 'singularity';
                warpSpeed = 35 - ((elapsed - 2.0) / 0.3) * 30;
                glitchOverlay.classList.add('active');
            } else if (elapsed >= 2.3 && elapsed < 3.4) {
                if (currentPhase !== 'breakout') {
                    currentPhase = 'breakout';
                    glitchOverlay.classList.remove('active');

                    flashOverlay.classList.add('active-flash');
                    setTimeout(() => flashOverlay.classList.remove('active-flash'), 180);

                    shockwave1.classList.remove('blast');
                    shockwave2.classList.remove('blast');
                    requestAnimationFrame(() => {
                        shockwave1.classList.add('blast');
                        shockwave2.classList.add('blast');
                    });

                    septagonSvg.style.opacity = '1';
                    septagonSvg.style.transform = 'scale(1) rotate(0deg)';
                    polyGlow.style.transition = 'stroke-dashoffset 1.1s ease-out';
                    polyCore.style.transition = 'stroke-dashoffset 1.1s ease-out';
                    polyGlow.style.strokeDashoffset = '0';
                    polyCore.style.strokeDashoffset = '0';

                    auraGlow.classList.add('active');

                    setTimeout(() => {
                        codeLogoSvg.classList.add('revealed');
                        [strokeLeft, coreLeft, strokeSlash, coreSlash, strokeRight, coreRight].forEach(el => {
                            el.classList.add('drawn');
                        });
                    }, 250);
                }
                warpSpeed = 4;
            } else {
                currentPhase = 'stable';
                warpSpeed = 2.2;
            }

            drawAllStars(warpSpeed);

            if (currentPhase === 'fast_warp' || currentPhase === 'singularity') {
                globalRotation += 0.030;
                for (let i = 0; i < tunnelRings.length; i++) {
                    const r = tunnelRings[i];
                    r.z -= warpSpeed * 1.5;
                    if (r.z <= 20) r.z += 1900;
                    const k = 420 / r.z;
                    const radius = 280 * k;

                    if (radius > 1 && radius < width * 1.25) {
                        ctx.lineWidth = Math.max(1, 3.5 * k);
                        if (i % 3 === 0) ctx.strokeStyle = 'rgba(0, 242, 254, 0.55)';
                        else if (i % 3 === 1) ctx.strokeStyle = 'rgba(255, 0, 127, 0.55)';
                        else ctx.strokeStyle = 'rgba(255, 87, 34, 0.55)';
                        drawSeptagon(ctx, cx, cy, radius, r.angle + globalRotation);
                        ctx.stroke();
                    }
                }
            }
        }

        startAnimation();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
